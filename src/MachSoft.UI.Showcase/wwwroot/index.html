<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MachSoft.UI.Showcase</title>
  <base href="/" />
  <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
  <link href="_content/MachSoft.UI/machsoft-ui.css" rel="stylesheet" />
</head>
<body>
  <div id="app">Loading...</div>
  <script src="_content/MudBlazor/MudBlazor.min.js"></script>
  <script>
    (function () {
      const fallbackKey = "mx-showcase-theme";
      const read = (key) => window.localStorage.getItem(key || fallbackKey);
      const write = (key, value) => window.localStorage.setItem(key || fallbackKey, value);
      const normalize = (value) => value === "dark" ? "dark" : "light";

      const savedTheme = normalize(read(fallbackKey));
      write(fallbackKey, savedTheme);
      if (savedTheme === "dark") {
        document.body.classList.add("mud-theme-dark");
      }

      window.machsoftTheme = {
        get: (key) => normalize(read(key)),
        set: (key, value) => {
          const nextTheme = normalize(value);
          write(key, nextTheme);
          document.body.classList.toggle("mud-theme-dark", nextTheme === "dark");
        }
      };
    })();
  </script>
  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
